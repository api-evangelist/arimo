name: Arimo
description: >-
  Arimo (formerly Adatao) was a Palo Alto, California AI and big-data startup
  building a distributed deep-learning and "Behavioral AI" analytics platform on
  top of Apache Spark, backed by Andreessen Horowitz (a16z) and Bloomberg Beta.
  The company was acquired by Panasonic in 2017 and folded into Panasonic's
  AI/innovation efforts, and it no longer operates as an independent provider.
  Surfaced as a portfolio-company lead for the API Evangelist network, this
  profile has no surviving developer portal, documentation, or public API
  surface to enrich - the arimo.com and arimo.ai domains no longer resolve.
